directive @inherits(type: String!) on OBJECT

input CreateTestInput {
  text: String!
}

"""An ISO-8601 date-time string."""
scalar Date

input DateFilter {
  equals: Date
  exists: Boolean
  gt: Date
  gte: Date
  in: [Date!]
  lt: Date
  lte: Date
  not_equals: Date
  not_in: [Date!]
}

"""An arbitrary JSON value."""
scalar JSON

type Mutation {
  createTest(input: CreateTestInput): Test!
  deleteTest(id: String!): Boolean!
  updateTest(id: String!, input: CreateTestInput): Test!
}

interface PaginatedDocs {
  total: Int!
}

type PaginatedTests implements PaginatedDocs {
  items: [Test!]
  total: Int!
}

type Query {
  test(id: String!): Test!
  tests(limit: Int, offset: Int, sortBy: String, where: Where): PaginatedTests!
}

input RelationWhere {
  every: Where
  is: Where
  isNot: Where
  none: Where
  some: Where
}

input StringFilter {
  contains: String
  equals: String
  exists: Boolean
  in: [String!]
  mode: WhereFieldMode
  not_equals: String
  not_in: [String!]
}

type Test {
  createdAt: Date!
  id: String!
  text: String!
  updatedAt: Date!
}

input TestListRelationFilter {
  every: TestScalarWhereInput
  none: TestScalarWhereInput
  some: TestScalarWhereInput
}

input TestRelationFilter {
  is: TestScalarWhereInput
  isNot: TestScalarWhereInput
}

input TestScalarWhereInput {
  AND: [TestScalarWhereInput!]
  OR: [TestScalarWhereInput!]
  createdAt: DateFilter
  id: StringFilter
  text: StringFilter
  updatedAt: DateFilter
}

input TestWhereInput {
  AND: [TestWhereInput!]
  OR: [TestWhereInput!]
  createdAt: DateFilter
  id: StringFilter
  text: StringFilter
  updatedAt: DateFilter
}

scalar Upload

input Where {
  and: [Where]
  field: String
  or: [Where]
  relation: RelationWhere
  value: WhereField
}

input WhereField {
  contains: JSON
  equals: JSON
  exists: JSON
  gt: JSON
  gte: JSON
  in: JSON
  lt: JSON
  lte: JSON
  mode: WhereFieldMode
  not_equals: JSON
  not_in: JSON
}

enum WhereFieldMode {
  default
  insensitive
}